name: vacibulero
description: English Vocabulary Learning App - MVVM + Auth + UI v2
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.2
  # Navigation
  go_router: ^13.2.0
  # HTTP requests
  http: ^1.2.1
  # Local persistence
  shared_preferences: ^2.2.3
  # Supabase (Auth + Database)
  supabase_flutter: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/expedition_content.json